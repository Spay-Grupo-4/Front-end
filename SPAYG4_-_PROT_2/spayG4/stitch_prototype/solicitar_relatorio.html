<script>
if (!document.getElementById('toast')) {
  const t = document.createElement('div');
  t.id = 'toast';
  t.role = 'status';
  t.setAttribute('aria-live','polite');
  t.className = 'fixed z-[100] bg-success-green text-on-primary px-4 py-2 rounded-md shadow-lg opacity-0 pointer-events-none transition-opacity duration-300';
  t.style.top = '72px';
  t.style.right = '16px';
  document.body.appendChild(t);
}
function showToast(message, type='info'){
  const toast = document.getElementById('toast');
  if(!toast) return;
  toast.textContent = message;
  toast.classList.remove('opacity-0');
  toast.classList.add('opacity-100');
  toast.classList.remove('bg-primary','bg-error-red','bg-success-green');
  if(type==='success') toast.classList.add('bg-success-green');
  else if(type==='error') toast.classList.add('bg-error-red');
  else toast.classList.add('bg-primary');
  clearTimeout(window._request_toast);
  window._request_toast = setTimeout(()=>{ toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); },7000);
}
</script>
