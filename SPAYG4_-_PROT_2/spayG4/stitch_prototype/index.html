    <style>
        body { font-family: 'Inter', sans-serif; }

            display: none;
            width: min(100%, 1200px);
            margin: 0 auto;

        .screen.active { display: block; }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

</head>
<body class="bg-background text-on-surface min-h-screen">
    <div id="app" class="min-h-screen">
        <!-- Login Screen -->
        <section id="screen-login" class="screen active">
            <div class="min-h-screen flex items-center justify-center p-4">
                <main class="w-full max-w-md">
                    <div class="relative overflow-hidden rounded-xl shadow-[0px_10px_40px_-10px_rgba(0,0,0,0.1)] border border-border-subtle p-8 md:p-10 bg-white">

                            <div class="w-20 h-20 bg-white flex items-center justify-center mb-6 shadow-sm">
                                <img src="assets/spayg4-logo.svg" alt="Logomarca SPAYG4" class="w-16 h-16" />
                            </div>
                            <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Acesso ao Sistema</h1>
                            <p class="font-body-md text-body-md text-on-surface-variant">Entre com usuário e senha</p>
                        </div>
                        <form id="login-form" class="relative z-10 space-y-6">
                            <div class="space-y-2 text-left">
                                <label for="login-username" class="block font-label-md text-label-md text-on-surface">Usuário</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                        <span class="material-symbols-outlined">person</span>
                                    </div>
                                    <input id="login-username" required type="text" placeholder="Seu usuário" class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-border-subtle rounded-lg font-body-md text-body-md text-on-surface placeholder-outline-variant focus:outline-none focus:border-primary focus:ring-0 transition-all duration-200" />
                                </div>
                            </div>
                            <div class="space-y-2 text-left">
                                <label for="login-password" class="block font-label-md text-label-md text-on-surface">Senha</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                        <span class="material-symbols-outlined">lock</span>
                                    </div>
                                    <input id="login-password" required type="password" placeholder="Sua senha" class="w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-border-subtle rounded-lg font-body-md text-body-md text-on-surface placeholder-outline-variant focus:outline-none focus:border-primary focus:ring-0 transition-all duration-200" />

                                        <span class="material-symbols-outlined">visibility_off</span>
                                    </button>
                                </div>
                            </div>
                            <div class="pt-4 flex flex-col space-y-4">
                                <button type="submit" class="w-full py-3 px-4 bg-primary-container hover:bg-primary text-on-primary font-title-md text-title-md rounded-lg shadow-sm hover:shadow-md transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2">
                                    Entrar
                                    <span class="material-symbols-outlined">login</span>
                                </button>
                                <div class="flex items-center justify-center gap-4 text-outline font-label-md text-label-md">
                                    <a href="#" class="text-on-surface-variant hover:text-primary transition-colors hover:underline underline-offset-4 decoration-border-subtle">Esqueceu a senha?</a>
                                </div>
                            </div>
                        </form>
                        <div class="mt-8 pt-6 border-t border-border-subtle text-center relative z-10">
                            <p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-1">
                                <span class="material-symbols-outlined text-[14px]">shield</span>
                                Acesso seguro ao Executive Portal
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        </section>

        <!-- Authenticated Shell -->
        <div id="shell" class="hidden lg:flex"> </div>
    </div>

    <template id="shell-template">
        <div class="flex w-full">

                <div class="flex-1 overflow-y-auto py-4">
                    <nav class="flex flex-col">

    <div id="toast" role="status" aria-live="polite" style="top:72px;right:16px;" class="fixed z-[100] bg-success-green text-on-primary px-4 py-2 rounded-md shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <script>
        const appState = {
            currentScreen: 'login',
            screens: {},
            initialized: false,
            user: null,
            notifications: []
        };

        const API_BASE_URL = `http://${window.location.hostname}:5000`;
        const AUTH_STORAGE_KEY = 'spayg4_prototype_auth';
        let reportsCache = [];
        let currentReportsPage = 1;
        const REPORTS_PAGE_SIZE = 5;

        function getStoredUser() {
            try {
                return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
            } catch (error) {
                return null;
            }
        }

        function isAdmin() {
            return appState.user?.username === 'admin' || appState.user?.area === 'Administrador';
        }

        function getReportRole() {
            const user = appState.user;
            if (!user) return null;
            if (user.username === 'vendas' || user.area === 'Vendas') return 'vendas';
            if (user.username === 'dados' || user.area === 'Dados') return 'dados';
            if (user.username === 'crmclientes' || user.area === 'CRM Clientes') return 'crm';
            if (user.username === 'crmleads' || user.area === 'CRM Leads') return 'crmleads';
            return null;
        }

        async function apiRequest(path, options = {}) {
            const response = await fetch(`${API_BASE_URL}${path}`, options);
            const contentType = response.headers.get('content-type') || '';
            const data = contentType.includes('application/json')
                ? await response.json()
                : await response.text();
            if (!response.ok) {
                throw new Error(data?.message || data || 'Falha na comunicação com a API.');
            }
            return data;
        }

        const badgeStyle = document.createElement('style');
        badgeStyle.textContent = `
            .badge { background: #f3f4f5; border: 1px solid #E2E8F0; color: #434655; font-size: 0.75rem; font-weight: 500; padding: 0.375rem 0.75rem; border-radius: 0.5rem; }
            .chip { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem 0.75rem; border-radius: 9999px; border: 1px solid #E2E8F0; background: #ffffff; color: #434655; cursor: pointer; transition: all 0.2s ease; }
            .chip:hover { border-color: #2563eb; background: rgba(37, 99, 235, 0.08); }
            .chip-active { border-color: #2563eb; background: rgba(37, 99, 235, 0.12); color: #2563eb; font-weight: 600; }
        `;
        document.head.appendChild(badgeStyle);

        const shellTemplate = document.getElementById('shell-template');
        const shellContainer = document.getElementById('shell');

        const passwordToggle = document.getElementById('toggle-password');
        if (passwordToggle) {
            passwordToggle.addEventListener('click', () => {
                const passwordInput = document.getElementById('login-password');
                const icon = passwordToggle.querySelector('.material-symbols-outlined');
                const showing = passwordInput.type === 'text';
                passwordInput.type = showing ? 'password' : 'text';
                passwordToggle.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
                if (icon) icon.textContent = showing ? 'visibility_off' : 'visibility';
            });
        }

        function injectShell() {
            if (appState.initialized) return;
            shellContainer.innerHTML = shellTemplate.innerHTML;
            shellContainer.classList.remove('hidden');
            shellContainer.classList.add('flex');
            const screens = ['dashboard', 'assistente-crm', 'ajuda', 'upload', 'cadastro-step1', 'cadastro-step2', 'cadastro-step3', 'relatorios'];
            screens.forEach((id) => {
                appState.screens[id] = document.getElementById(`screen-${id}`);
            });
            bindNavigation();
            applyPermissions();
            bindHeaderActions();
            appState.initialized = true;
        }

        function getNotificationOwner() {
            return appState.user?.username?.trim().toLowerCase() || null;
        }

        function resetNotifications() {
            appState.notifications = [];
            document.getElementById('notifications-dot')?.classList.add('hidden');
            document.getElementById('notifications-panel')?.classList.add('hidden');
            renderNotifications();
        }

        function addNotification(message, owner = getNotificationOwner()) {
            if (!owner) return;
            // store notification without sensitive names -- message should be generic
            appState.notifications.push({ owner, message, createdAt: new Date().toISOString() });
            const dot = document.getElementById('notifications-dot');
            if (dot) dot.classList.remove('hidden');
            renderNotifications();
        }

        function renderNotifications() {
            const list = document.getElementById('notifications-list');
            if (!list) return;
            const owner = getNotificationOwner();
            const userNotifications = appState.notifications.filter((item) => item.owner === owner);
            list.innerHTML = userNotifications.length
                ? userNotifications.map((item) => `
                    <div class="border border-border-subtle rounded-md bg-surface-bright px-3 py-3">
                        <span class="material-symbols-outlined text-primary align-middle mr-1 text-[18px]">info</span>
                        ${item.message}
                    </div>
                `).join('')
                : '<p class="text-body-md text-on-surface-variant">Nenhuma notificação nova.</p>';
        }

        function bindHeaderActions() {
            const notificationButton = document.getElementById('notifications-button');
            const helpButton = document.getElementById('help-button');
            let notificationsAutoCloseTimer = null;
            if (notificationButton) {
                notificationButton.addEventListener('click', () => {
                    const panel = document.getElementById('notifications-panel');
                    renderNotifications();
                    const isHidden = panel?.classList.toggle('hidden');
                    // hide dot immediately
                    document.getElementById('notifications-dot')?.classList.add('hidden');
                    // if panel is now visible, auto-close after 7s
                    if (!panel.classList.contains('hidden')) {
                        clearTimeout(notificationsAutoCloseTimer);
                        notificationsAutoCloseTimer = setTimeout(() => {
                            panel.classList.add('hidden');
                        }, 7000);
                    } else {
                        clearTimeout(notificationsAutoCloseTimer);
                    }
                });
            }
            if (helpButton) helpButton.addEventListener('click', () => showScreen('ajuda'));
        }

        function setHidden(element, hidden) {
            if (element) element.classList.toggle('hidden', hidden);
        }

        function getAvatarPath() {
            const avatars = {
                admin: 'assets/avatar-minimalista-admin.svg',
                'CRM Clientes': 'assets/avatar-clientes.svg',
                Dados: 'assets/avatar-dados.svg',
                'CRM Leads': 'assets/avatar-leads.svg',
                Vendas: 'assets/avatar-vendas.svg',
            };
            return avatars[appState.user?.area] || avatars.admin;
        }

        function updateUserAvatar() {
            const avatarPath = getAvatarPath();
            ['sidebar-avatar', 'header-avatar'].forEach((id) => {
                const avatar = document.getElementById(id);
                if (avatar) {
                    avatar.src = avatarPath;
                    avatar.alt = `Avatar de ${appState.user?.area || 'administrador'}`;
                }
            });
            const loggedUser = document.getElementById('logged-user');
            if (loggedUser) {
                loggedUser.textContent = appState.user?.username || '';
                loggedUser.title = appState.user?.area || '';
            }
        }

        function applyPermissions() {
            const admin = isAdmin();
            const reportLinks = shellContainer.querySelectorAll('[data-nav="relatorios"]');
            const assistantLinks = shellContainer.querySelectorAll('[data-nav="assistente-crm"]');
            const grafanaButton = shellContainer.querySelector('[data-action="open-grafana"]');
            const reportScreen = document.getElementById('screen-relatorios');
            const assistantScreen = document.getElementById('screen-assistente-crm');
            const grafanaCard = grafanaButton?.closest('article');
            const reportSection = document.querySelector('#screen-dashboard [data-nav="relatorios"]')?.closest('section');
            const assistantSection = document.querySelector('#screen-dashboard [data-nav="assistente-crm"]')?.closest('section');

            reportLinks.forEach((link) => setHidden(link, admin));
            assistantLinks.forEach((link) => setHidden(link, admin));
            setHidden(reportScreen, admin);
            setHidden(assistantScreen, admin);
            setHidden(grafanaCard, !admin);
            setHidden(reportSection, admin);
            setHidden(assistantSection, admin);
            const actionGrid = document.getElementById('dashboard-action-grid');
            if (actionGrid) {
                actionGrid.classList.toggle('lg:grid-cols-3', admin);
                actionGrid.classList.toggle('lg:grid-cols-2', !admin);
            }
            updateUserAvatar();
        }

        function showToast(message, type = 'info', title = '') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            // adjust appearance by type (success -> green, error -> red, info -> neutral)
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            toast.classList.remove('bg-primary', 'bg-success-green', 'bg-error-red');
            if (type === 'success') toast.classList.add('bg-success-green');
            else if (type === 'error') toast.classList.add('bg-error-red');
            else toast.classList.add('bg-primary');
            clearTimeout(window.toastTimeout);
            // keep toast visible for 7 seconds as requested
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 7000);
        }

        function updateNavActive(target) {
            const links = shellContainer.querySelectorAll('.nav-link');
            links.forEach((link) => {
                const isActive = link.dataset.nav === target;
                link.classList.toggle('bg-primary-container', isActive);
                link.classList.toggle('text-on-primary-container', isActive);
                link.classList.toggle('border-l-4', isActive);
                link.classList.toggle('border-primary-fixed', isActive);
            });
        }

        function showScreen(id) {
            if (id === 'relatorios' && isAdmin()) {
                showToast('O usuário administrador não possui acesso a relatórios.');
                return;
            }
            if (id === 'assistente-crm' && isAdmin()) {
                showToast('O Assistente CRM não está disponível para o administrador.');
                return;
            }
            if (id === appState.currentScreen) return;

            if (id === 'login') {
                document.getElementById('screen-login').classList.add('active');
                shellContainer.classList.add('hidden');
                shellContainer.classList.remove('flex');
            } else {
                if (!appState.initialized) injectShell();
                document.getElementById('screen-login').classList.remove('active');
                shellContainer.classList.remove('hidden');
                shellContainer.classList.add('flex');
                Object.entries(appState.screens).forEach(([key, element]) => {
                    if (!element) return;
                    element.classList.toggle('active', key === id);
                    element.classList.toggle('screen', true);
                });
                updateNavActive(id);
            }

            appState.currentScreen = id;
        }

        function resetCadastroFlow() {
            const forms = ['form-step1', 'form-step2', 'form-step3'];
            forms.forEach((formId) => {
                const form = document.getElementById(formId);
                if (form) form.reset();
            });
        }

        function validateLeadFields(fieldIds, message) {
            const fields = fieldIds.map((id) => document.getElementById(id)).filter(Boolean);
            const missingField = fields.find((field) => !field.value.trim());
            if (missingField) {
                missingField.focus();
                showToast(message);
                return false;
            }
            return true;
        }

        function validateLeadStep1() {
            if (!validateLeadFields(
                ['lead-cnpj', 'lead-type', 'lead-razao-social', 'lead-nome-comercial', 'lead-telefone'],
                'Preencha todos os campos obrigatórios da identificação.',
            )) return false;
            const cnpj = document.getElementById('lead-cnpj').value.replace(/\D/g, '');
            const phone = document.getElementById('lead-telefone').value.replace(/\D/g, '');
            if (cnpj.length !== 14) {
                showToast('O CNPJ deve conter 14 dígitos.');
                document.getElementById('lead-cnpj').focus();
                return false;
            }
            if (![10, 11].includes(phone.length)) {
                showToast('Informe um telefone válido com DDD.');
                document.getElementById('lead-telefone').focus();
                return false;
            }
            return true;
        }

        function validateLeadStep2() {
            if (!validateLeadFields(
                ['lead-cep', 'lead-uf', 'lead-municipio', 'lead-bairro', 'lead-logradouro'],
                'Preencha todos os campos obrigatórios do endereço.',
            )) return false;
            const cep = document.getElementById('lead-cep').value.replace(/\D/g, '');
            if (cep.length !== 8) {
                showToast('O CEP deve conter 8 dígitos.');
                document.getElementById('lead-cep').focus();
                return false;
            }
            return true;
        }

        function setupLeadMasks() {
            const cnpj = document.getElementById('lead-cnpj');
            const phone = document.getElementById('lead-telefone');
            const cep = document.getElementById('lead-cep');
            const uf = document.getElementById('lead-uf');
            const patrimonio = document.getElementById('lead-patrimonio');

            if (cnpj) cnpj.addEventListener('input', () => {
                const digits = cnpj.value.replace(/\D/g, '').slice(0, 14);
                cnpj.value = digits.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/, '$1.$2.$3/$4-$5');
            });
            if (phone) phone.addEventListener('input', () => {
                const digits = phone.value.replace(/\D/g, '').slice(0, 11);
                phone.value = digits.length > 10
                    ? digits.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, '($1) $2-$3')
                    : digits.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            });
            if (cep) {
                cep.addEventListener('input', () => {
                    const digits = cep.value.replace(/\D/g, '').slice(0, 8);
                    cep.value = digits.replace(/^(\d{5})(\d{0,3}).*/, '$1-$2');
                });
                cep.addEventListener('blur', async () => {
                    const digits = cep.value.replace(/\D/g, '');
                    if (digits.length !== 8) return;
                    try {
                        const response = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
                        const data = await response.json();
                        if (data.erro) return;
                        document.getElementById('lead-logradouro').value = data.logradouro || '';
                        document.getElementById('lead-bairro').value = data.bairro || '';
                        document.getElementById('lead-municipio').value = data.localidade || '';
                        document.getElementById('lead-uf').value = data.uf || '';
                    } catch (error) {
                        showToast('Não foi possível consultar o CEP.');
                    }
                });
            }
            if (uf) uf.addEventListener('input', () => {
                uf.value = uf.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 2);
            });
            if (patrimonio) patrimonio.addEventListener('input', () => {
                const digits = patrimonio.value.replace(/\D/g, '');
                patrimonio.value = digits ? (Number(digits) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '';
            });
        }

        function getReportConfig() {
            const configs = {
                vendas: { request: '/relatorios/solicitar', list: '/relatorios/listar' },
                dados: { request: '/relatorios/dados/solicitar', list: '/relatorios/dados/listar' },
                crm: { request: '/relatorios/crm/solicitar', list: '/relatorios/crm/listar' },
                crmleads: { request: '/relatorios/crm-leads/solicitar', list: '/relatorios/crm-leads/listar' },
            };
            return configs[getReportRole()];
        }

        function renderReportRows(target, reports) {
            if (!target) return;
            if (!reports.length) {
                target.innerHTML = '<tr><td colspan="4" class="py-8 px-gutter text-center text-on-surface-variant">Nenhum relatório encontrado.</td></tr>';
                return;
            }
            target.innerHTML = reports.map((report) => `
                <tr class="hover:bg-surface-container-lowest transition-colors">
                    <td class="py-4 px-gutter font-medium">${report.name || report.key || 'Relatório'}</td>
                    <td class="py-4 px-gutter text-on-surface-variant">${report.last_modified ? new Date(report.last_modified).toLocaleString('pt-BR') : 'Data desconhecida'}</td>
                    <td class="py-4 px-gutter"><span class="inline-flex items-center px-2.5 py-1 rounded-full bg-success-green/10 text-success-green font-label-sm">Disponível</span></td>
                    <td class="py-4 px-gutter text-right"><a class="text-primary hover:underline font-label-md" href="${report.url}" target="_blank" rel="noopener">Baixar</a></td>
                </tr>
            `).join('');
        }

        function applyReportFilters() {
            const search = (document.getElementById('reports-search')?.value || '').trim().toLowerCase();
            const dateFilter = document.getElementById('reports-date-filter')?.value || 'all';
            const now = Date.now();
            const periods = { '7': 7, '30': 30, '90': 90 };
            const cutoff = periods[dateFilter] ? now - periods[dateFilter] * 86400000 : null;
            const filtered = reportsCache.filter((report) => {
                const name = `${report.name || ''} ${report.key || ''}`.toLowerCase();
                const timestamp = report.last_modified ? new Date(report.last_modified).getTime() : 0;
                return (!search || name.includes(search)) && (!cutoff || timestamp >= cutoff);
            });
            const totalPages = Math.max(1, Math.ceil(filtered.length / REPORTS_PAGE_SIZE));
            currentReportsPage = Math.min(currentReportsPage, totalPages);
            const start = (currentReportsPage - 1) * REPORTS_PAGE_SIZE;
            renderReportRows(document.getElementById('reports-tbody'), filtered.slice(start, start + REPORTS_PAGE_SIZE));
            const count = document.getElementById('reports-count');
            if (count) count.textContent = `Exibindo ${filtered.length ? start + 1 : 0}–${Math.min(start + REPORTS_PAGE_SIZE, filtered.length)} de ${filtered.length} resultado(s); ${reportsCache.length} relatório(s) no bucket.`;
            renderReportsPagination(totalPages);
        }

        function renderReportsPagination(totalPages) {
            const pagination = document.getElementById('reports-pagination');
            if (!pagination) return;
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            pagination.innerHTML = `
                <button type="button" data-reports-page="${currentReportsPage - 1}" ${currentReportsPage === 1 ? 'disabled' : ''} class="px-3 py-1 rounded border border-border-subtle text-on-surface hover:bg-surface-container-low disabled:opacity-50 disabled:cursor-not-allowed">Anterior</button>
                <span class="px-2">Página ${currentReportsPage} de ${totalPages}</span>
                <button type="button" data-reports-page="${currentReportsPage + 1}" ${currentReportsPage === totalPages ? 'disabled' : ''} class="px-3 py-1 rounded border border-border-subtle text-on-surface hover:bg-surface-container-low disabled:opacity-50 disabled:cursor-not-allowed">Próxima</button>
            `;
        }

        function renderReports(reports) {
            reportsCache = reports;
            currentReportsPage = 1;
            const tbody = document.getElementById('reports-tbody');
            const dashboardTbody = document.getElementById('dashboard-reports-tbody');
            renderReportRows(dashboardTbody, reports.slice(0, REPORTS_PAGE_SIZE));
            applyReportFilters();
            const count = document.getElementById('reports-count');
            if (count && !reports.length) count.textContent = 'Nenhum relatório encontrado no bucket.';
        }

        async function loadReports() {
            const config = getReportConfig();
            if (!config || !appState.user) return;
            try {
                const result = await apiRequest(config.list, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appState.user),
                });
                renderReports(result.reports || []);
            } catch (error) {
                showToast(error.message);
                renderReports([]);
            }
        }

        async function requestReport() {
            if (isAdmin()) {
                showToast('O usuário administrador não pode gerar relatórios.');
                return;
            }
            const notificationOwner = getNotificationOwner();
            const config = getReportConfig();
            if (!config) return;
            showToast('Solicitando relatório...', 'info');
            try {
                const result = await apiRequest(config.request, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appState.user),
                });
                showToast('A solicitação foi enviada e o relatório está sendo criado.', 'success');
                setTimeout(() => {
                    // do not expose report name in notifications
                    const message = 'Relatório criado com sucesso. Vá para a página de Relatórios para acessá-lo.';
                    addNotification(message, notificationOwner);
                    showToast(message, 'success', 'Relatório criado');
                }, 1800);
                await loadReports();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function bindNavigation() {
            shellContainer.querySelectorAll('[data-nav]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const target = btn.dataset.nav;
                    if (target === 'cadastro-step1') {
                        resetCadastroFlow();
                    }
                    showScreen(target);
                    if (target === 'relatorios') loadReports();
                });
            });

            const logoutBtn = shellContainer.querySelector('[data-action="logout"]');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    resetCadastroFlow();
                    appState.user = null;
                    resetNotifications();
                    localStorage.removeItem(AUTH_STORAGE_KEY);
                    showScreen('login');
                    document.getElementById('login-password').value = '';
                    appState.initialized = false;
                    appState.screens = {};
                    shellContainer.innerHTML = '';
                    shellContainer.classList.add('hidden');
                    shellContainer.classList.remove('flex');
                    showToast('Sessão encerrada.');

            }

            const nextStep1 = document.getElementById('next-step1');
            if (nextStep1) nextStep1.addEventListener('click', () => {
                if (validateLeadStep1()) showScreen('cadastro-step2');
            });

            const backStep2 = document.getElementById('back-step2');
            if (backStep2) backStep2.addEventListener('click', () => showScreen('cadastro-step1'));

            const nextStep2 = document.getElementById('next-step2');
            if (nextStep2) nextStep2.addEventListener('click', () => {
                if (validateLeadStep2()) showScreen('cadastro-step3');
            });

            const backStep3 = document.getElementById('back-step3');
            if (backStep3) backStep3.addEventListener('click', () => showScreen('cadastro-step2'));

            const submitLead = document.getElementById('submit-lead');
            if (submitLead) {
                submitLead.addEventListener('click', async (event) => {
                    event.preventDefault();
                    if (!validateLeadStep1() || !validateLeadStep2()) return;
                    const notificationOwner = getNotificationOwner();
                    const payload = {
                        cnpj: document.getElementById('lead-cnpj').value,
                        type: document.getElementById('lead-type').value,
                        nomeSocial: document.getElementById('lead-razao-social').value,
                        nomeComercial: document.getElementById('lead-nome-comercial').value,
                        telefone: document.getElementById('lead-telefone').value,
                        cep: document.getElementById('lead-cep').value,
                        uf: document.getElementById('lead-uf').value,
                        municipio: document.getElementById('lead-municipio').value,
                        bairro: document.getElementById('lead-bairro').value,
                        logradouro: document.getElementById('lead-logradouro').value,
                        complemento: document.getElementById('lead-complemento').value,
                        patrimonioLiquido: document.getElementById('lead-patrimonio').value,
                        segmentoComercial: document.getElementById('lead-segmento').value,
                        dataInicioSituacao: document.getElementById('lead-data-inicio').value,
                        dataRegistro: document.getElementById('lead-data-registro').value,
                    };
                    try {
                        const result = await apiRequest('/leads', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                        });
                        resetCadastroFlow();
                        showScreen('dashboard');
                        // don't include lead/report names in notification messages
                        const message = 'Lead cadastrado com sucesso.';
                        addNotification(message, notificationOwner);
                        showToast(message, 'success', 'Lead cadastrado');
                    } catch (error) {
                        showToast(error.message, 'error');
                    }
                });
            }

            const selectPdf = document.getElementById('select-pdf');
            const pdfFile = document.getElementById('pdf-file');
            const uploadPdf = document.getElementById('upload-pdf');
            const pdfDropZone = document.getElementById('screen-upload')?.querySelector('.border-dashed');
            const selectedPdfName = document.getElementById('selected-pdf-name');
            function setSelectedPdf(file) {
                if (!file) return;
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    showToast('Envie um arquivo no formato PDF.');
                    return;
                }
                const transfer = new DataTransfer();
                transfer.items.add(file);
                pdfFile.files = transfer.files;
                selectedPdfName.textContent = `Arquivo selecionado: ${file.name}`;
                selectedPdfName.classList.remove('hidden');
            }
            if (selectPdf && pdfFile) selectPdf.addEventListener('click', () => pdfFile.click());
            if (pdfFile) pdfFile.addEventListener('change', () => setSelectedPdf(pdfFile.files?.[0]));
            if (pdfDropZone) {
                pdfDropZone.addEventListener('dragover', (event) => {
                    event.preventDefault();
                    pdfDropZone.classList.add('bg-surface-container');
                });
                pdfDropZone.addEventListener('dragleave', () => pdfDropZone.classList.remove('bg-surface-container'));
                pdfDropZone.addEventListener('drop', (event) => {
                    event.preventDefault();
                    pdfDropZone.classList.remove('bg-surface-container');
                    setSelectedPdf(event.dataTransfer.files?.[0]);
                });
            }
            if (uploadPdf && pdfFile) {
                uploadPdf.addEventListener('click', async () => {
                    const file = pdfFile.files?.[0];
                    if (!file) {
                        showToast('Selecione um arquivo PDF antes de enviar.');
                        return;
                    }
                    if (!file.name.toLowerCase().endsWith('.pdf')) {
                        showToast('Envie um arquivo no formato PDF.');
                        return;
                    }
                    const formData = new FormData();
                    formData.append('file', file);
                    try {
                        const result = await apiRequest('/upload_pdf', {
                            method: 'POST',
                            body: formData,
                        });
                        pdfFile.value = '';
                        selectedPdfName.textContent = '';
                        selectedPdfName.classList.add('hidden');
                        showToast(result.message || 'PDF enviado com sucesso para a bronze.', 'success');
                    } catch (error) {
                        showToast(error.message, 'error');
                    }
                });
            }

            const requestButtons = [
                document.getElementById('request-report'),
                document.getElementById('request-report-dashboard'),
            ].filter(Boolean);
            requestButtons.forEach((button) => button.addEventListener('click', requestReport));

            const reportsSearch = document.getElementById('reports-search');
            const reportsDateFilter = document.getElementById('reports-date-filter');
            if (reportsSearch) reportsSearch.addEventListener('input', () => {
                currentReportsPage = 1;
                applyReportFilters();
            });
            if (reportsDateFilter) reportsDateFilter.addEventListener('change', () => {
                currentReportsPage = 1;
                applyReportFilters();
            });

            const reportsPagination = document.getElementById('reports-pagination');
            if (reportsPagination) reportsPagination.addEventListener('click', (event) => {
                const button = event.target.closest('[data-reports-page]');
                if (!button || button.disabled) return;
                currentReportsPage = Number(button.dataset.reportsPage);
                applyReportFilters();
            });

            const grafanaButton = document.querySelector('[data-action="open-grafana"]');
            if (grafanaButton) {
                grafanaButton.addEventListener('click', async () => {
                    if (!isAdmin()) {
                        showToast('Acesso ao Grafana disponível apenas para o administrador.');
                        return;
                    }
                    const grafanaWindow = window.open(`http://${window.location.hostname}:3000`, '_blank');
                    let host = window.location.hostname;
                    try {
                        const result = await apiRequest('/infra/ec2-ipv4');
                        host = result.ipv4 || host;
                    } catch (error) {
                        showToast('Infraestrutura indisponível; tentando o Grafana no host atual.');
                    }
                    const grafanaUrl = `http://${host}:3000`;
                    if (grafanaWindow && host !== window.location.hostname) grafanaWindow.location = grafanaUrl;
                    else if (!grafanaWindow) window.location.href = grafanaUrl;
                });
            }

            const assistantInput = document.getElementById('assistant-input');
            const assistantSend = document.getElementById('assistant-send');
            const assistantClear = document.getElementById('assistant-clear');
            const assistantShortcut = shellContainer.querySelector('[data-nav="assistente-crm"]');
            const chatForm = document.getElementById('crm-chat-form');
            const chatInput = document.getElementById('crm-chat-input');
            const chatMessages = document.getElementById('crm-chat-messages');
            const chatList = document.getElementById('crm-chat-list');
            const newChatButton = document.getElementById('crm-new-chat');
            const deleteChatButton = document.getElementById('crm-delete-chat');
            const chatsStorageKey = 'stitch-crm-chats';
            const selectedChatStorageKey = 'stitch-crm-selected-chat';
            const chatEndpoint = 'http://32.199.62.181/webhook/rag-agent';

            let chats = JSON.parse(localStorage.getItem(chatsStorageKey) || '[]');
            let selectedChatId = localStorage.getItem(selectedChatStorageKey);

            function saveChats() {
                localStorage.setItem(chatsStorageKey, JSON.stringify(chats));
                if (selectedChatId) localStorage.setItem(selectedChatStorageKey, selectedChatId);
            }

            function createChat() {
                const chat = {
                    id: `stitch-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                    title: 'Novo chat',
                    messages: [{ text: 'Olá! Como posso ajudar?', type: 'bot' }],
                };
                chats.unshift(chat);
                selectedChatId = chat.id;
                saveChats();
                renderChatList();
                renderSelectedChat();
            }

            function getSelectedChat() {
                return chats.find((chat) => chat.id === selectedChatId);
            }

            function renderChatList() {
                if (!chatList) return;
                chatList.innerHTML = '';
                chats.forEach((chat) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = chat.title;
                    button.className = `w-full text-left px-3 py-2 rounded-md text-body-md transition-colors ${chat.id === selectedChatId ? 'bg-primary-container text-white' : 'bg-surface-card text-on-surface hover:bg-surface-container'}`;
                    button.addEventListener('click', () => {
                        selectedChatId = chat.id;
                        saveChats();
                        renderChatList();
                        renderSelectedChat();
                    });
                    chatList.appendChild(button);
                });
            }

            function renderSelectedChat() {
                const chat = getSelectedChat();
                if (!chatMessages || !chat) return;
                chatMessages.innerHTML = '';
                chat.messages.forEach((message) => addChatMessage(message.text, message.type, false));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function addChatMessage(text, type, persist = true) {
                if (!chatMessages) return;
                const message = document.createElement('div');
                message.className = `flex items-start gap-2 ${type === 'user' ? 'self-end justify-end' : 'self-start justify-start'}`;
                const bubble = document.createElement('div');
                bubble.className = type === 'user'
                    ? 'relative max-w-[80%] rounded-lg bg-primary-container px-4 py-3 text-body-md text-white'
                    : 'relative max-w-[80%] rounded-lg border border-border-subtle bg-surface-card px-4 py-3 text-body-md text-on-surface-variant';
                bubble.textContent = text;
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'ml-2 text-[12px] text-outline hover:text-error-red p-1';
                delBtn.setAttribute('aria-label', 'Excluir mensagem');
                delBtn.innerHTML = '<span class="material-symbols-outlined">close</span>';
                delBtn.addEventListener('click', () => {
                    message.remove();
                    const chat = getSelectedChat();
                    if (chat) {
                        const idx = chat.messages.findIndex((m) => m.text === text && m.type === type);
                        if (idx >= 0) {
                            chat.messages.splice(idx, 1);
                            saveChats();
                            renderChatList();
                        }
                    }
                });
                message.appendChild(bubble);
                message.appendChild(delBtn);
                chatMessages.appendChild(message);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                if (persist) {
                    const chat = getSelectedChat();
                    if (chat) {
                        chat.messages.push({ text, type });
                        if (type === 'user' && chat.title === 'Novo chat') chat.title = text.slice(0, 28);
                        saveChats();
                        renderChatList();
                    }
                }
            }

            function deleteSelectedChat() {
                if (!selectedChatId) return;
                chats = chats.filter((chat) => chat.id !== selectedChatId);
                if (!chats.length) {
                    createChat();
                    return;
                }
                selectedChatId = chats[0].id;
                saveChats();
                renderChatList();
                renderSelectedChat();
            }

            function getChatSessionId() {
                return selectedChatId;
            }

            if (!chats.length || !chats.some((chat) => chat.id === selectedChatId)) createChat();
            else {
                renderChatList();
                renderSelectedChat();
            }

            async function sendChatMessage(question) {
                addChatMessage(question, 'user');
                addChatMessage('Digitando...', 'bot', false);
                const typingMessage = chatMessages?.lastElementChild;

                try {
                    const response = await fetch(chatEndpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'query',
                            question,
                            session_id: getChatSessionId(),
                        }),
                    });
                    const contentType = response.headers.get('content-type') || '';
                    const data = contentType.includes('application/json')
                        ? await response.json()
                        : await response.text();
                    if (typingMessage) typingMessage.remove();
                    if (!response.ok) {
                        addChatMessage('Não foi possível responder agora.', 'bot');
                        return;
                    }
                    const answer = typeof data === 'string'
                        ? data
                        : (data.answer || data.response || data.output || JSON.stringify(data));
                    addChatMessage(answer, 'bot');
                } catch (error) {
                    console.error('Erro ao chamar o Assistente CRM:', error);
                    if (typingMessage) typingMessage.remove();
                    addChatMessage('Não foi possível conectar ao Assistente CRM.', 'bot');
                }
            }

            if (assistantShortcut) {
                assistantShortcut.addEventListener('click', () => showScreen('assistente-crm'));
            }

            if (assistantSend) {
                assistantSend.addEventListener('click', (e) => {
                    // prevent default navigation
                    e.preventDefault?.();
                    const text = assistantInput?.value.trim();
                    // open assistant panel (in-app) instead of navigating away
                    showScreen('assistente-crm');
                    setTimeout(() => {
                        if (text) {
                            const fullInput = document.getElementById('crm-chat-input');
                            if (fullInput) {
                                fullInput.value = text;
                                // trigger form submit handler directly to avoid full page navigation
                                const form = document.getElementById('crm-chat-form');
                                if (form) {
                                    const ev = new Event('submit', { cancelable: true });
                                    form.dispatchEvent(ev);
                                }
                            }
                            assistantInput.value = '';
                        }
                    }, 120);
                });
            }
            if (assistantClear) {
                assistantClear.addEventListener('click', () => {
                    if (assistantInput) assistantInput.value = '';
                });
            }

            if (assistantInput) {
                assistantInput.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        showScreen('assistente-crm');
                    }
                });
            }

            if (newChatButton) {
                newChatButton.addEventListener('click', createChat);
            }

            if (deleteChatButton) {
                deleteChatButton.addEventListener('click', deleteSelectedChat);
            }

            if (chatForm && chatInput) {
                chatForm.addEventListener('submit', (event) => {
                    event.preventDefault();
                    const question = chatInput.value.trim();
                    if (!question) return;
                    chatInput.value = '';
                    sendChatMessage(question);
                });
            }

            const fullPeriodRadios = Array.from(document.querySelectorAll('input[name="full-period"]'));
            const startDateInput = document.getElementById('report-start-date');
            const endDateInput = document.getElementById('report-end-date');

            function updateDateInputs() {
                if (!startDateInput || !endDateInput || !fullPeriodRadios.length) return;
                const selected = fullPeriodRadios.find((radio) => radio.checked);
                const disableDates = selected && selected.value === 'sim';
                [startDateInput, endDateInput].forEach((input) => {
                    input.disabled = disableDates;
                    input.classList.toggle('opacity-60', disableDates);
                    input.classList.toggle('cursor-not-allowed', disableDates);
                    if (disableDates) {
                        input.value = '';
                    }
                });
            }

            if (fullPeriodRadios.length) {
                fullPeriodRadios.forEach((radio) => {
                    radio.addEventListener('change', updateDateInputs);
                });
                updateDateInputs();
            }

            setupLeadMasks();

        }

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            try {
                const result = await apiRequest('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                appState.user = result.user;
                resetNotifications();
                localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(result.user));
                injectShell();
                applyPermissions();
                showScreen('dashboard');
                showToast(`Login realizado. Área: ${result.user.area}.`);
                if (!isAdmin()) loadReports();
            } catch (error) {
                showToast(error.message || 'Usuário ou senha inválidos.');
            }
        });

        const storedUser = getStoredUser();
        if (storedUser) {
            appState.user = storedUser;
            injectShell();
            showScreen('dashboard');
            if (!isAdmin()) loadReports();
        }
    </script>
</body>
</html>
